<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuizApp</title>

    <link rel="stylesheet" href="style.css">
    <script src="array.js"></script>
    <script src="script.js"></script>

    <!--Bootstrap file-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body onload="init()">

    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">QuizApp</span>
        </div>
    </nav>

    <div class="container">
        <div class="card quiz-card">
            <img src="./img/pencil.jpg" class="card-img-top" alt="illustrated_background_picture">
            
            <div class="card-body" id="end-screen" style="display:none;">
                
                <div class="text-center">
                    <b>Quiz ended ! </b>
                </div>

                <div>
                    <img class="width-100" src="./img/trophy.png" alt="trophy-icon">
                </div>

                <div class="text-center">
                    You have <b>XX</b> of <b>XX</b> right answers !
                </div>

            </div>
            
            
            
            <div class="card-body" id="question-body">
                <h5 class="card-title" id="questionText">Question</h5>

                <div class="card mb-2 quiz-answer-card" onclick="answer('answer_1')">
                    <div class="card-body" id="answer_1">
                        Answer
                    </div>
                </div>

                <div class="card mb-2 quiz-answer-card" onclick="answer('answer_2')">
                    <div class="card-body" id="answer_2">
                        Answer
                    </div>
                </div>

                <div class="card mb-2 quiz-answer-card" onclick="answer('answer_3')">
                    <div class="card-body" id="answer_3">
                        Answer
                    </div>
                </div>

                <div class="card mb-2 quiz-answer-card" onclick="answer('answer_4')">
                    <div class="card-body" id="answer_4">
                        Answer
                    </div>
                </div>

                <div class="question-footer">
                    
                    
                    <span>
                        <b id="question-number">1</b> of <b id="all-questions">5</b> questions
                    </span>

                    <button onclick="nextQuestion()" class="btn btn-secondary" id="next-button" disabled>Next</button>

                </div>




            </div>
        </div>
    </div>








</body>

</html>
